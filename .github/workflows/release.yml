name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Create release for a new version
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^VERSION="\([^"]*\)"$/\1/p' codex-move-session | head -n1)"
          if [ -z "$version" ]; then
            echo "::error::Could not read VERSION from codex-move-session"
            exit 1
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$version'; expected MAJOR.MINOR.PATCH"
            exit 1
          fi

          expected="codex-move-session v$version"
          actual="$(bash codex-move-session --version)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Version mismatch: expected '$expected', got '$actual'"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether release tag exists
        id: tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists; skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist; a release will be created."
          fi

      - name: Create GitHub release
        if: steps.tag.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "codex-move-session $TAG" \
            --generate-notes \
            codex-move-session \
            install.sh
